name: Make Shafaz signing key

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore shafaz.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias shafaz \
            -storepass "ShafazKey2026!" -keypass "ShafazKey2026!" \
            -dname "CN=Shafaz Canteen, OU=App, O=Shafaz Grand, L=Kerala, S=Kerala, C=IN"
          base64 -w 0 shafaz.jks > shafaz.b64
      - uses: actions/upload-artifact@v4
        with:
          name: shafaz-signing-key
          path: shafaz.b64
