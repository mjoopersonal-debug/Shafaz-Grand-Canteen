name: Build Shafaz APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --org com.shafazgrand --project-name shafaz_canteen --platforms android .

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/shafaz.jks

      - name: Patch Android for alarms, Firebase, name and signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - << 'PYEOF'
          import re, os
          pw = os.environ['KEYSTORE_PASSWORD']
          alias = os.environ['KEY_ALIAS']
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ['SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','POST_NOTIFICATIONS','WAKE_LOCK','VIBRATE','USE_FULL_SCREEN_INTENT','RECEIVE_BOOT_COMPLETED','FOREGROUND_SERVICE','FOREGROUND_SERVICE_MEDIA_PLAYBACK','REQUEST_IGNORE_BATTERY_OPTIMIZATIONS','INTERNET']
          add = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in perms)
          s = s.replace('<application', add + '    <application', 1)
          s = s.replace('<activity', '<activity android:showWhenLocked="true" android:turnScreenOn="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Shafaz Canteen"', s, count=1)
          open(p, 'w').write(s)
          g = 'android/app/build.gradle.kts'
          t = open(g).read()
          t = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 26', t)
          t = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', t)
          t = re.sub(r'applicationId\s*=\s*"[^"]*"', 'applicationId = "com.shafazgrand.canteen"', t)
          signing = (
              'signingConfigs {\n'
              '        create("shafaz") {\n'
              '            storeFile = file("shafaz.jks")\n'
              '            storePassword = "' + pw + '"\n'
              '            keyAlias = "' + alias + '"\n'
              '            keyPassword = "' + pw + '"\n'
              '        }\n'
              '    }\n'
              '    buildTypes {'
          )
          t = t.replace('buildTypes {', signing, 1)
          t = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("shafaz")', t)
          if 'google-services' not in t:
              t = t.replace('id("dev.flutter.flutter-gradle-plugin")', 'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")', 1)
          open(g, 'w').write(t)
          r = 'android/settings.gradle.kts'
          u = open(r).read()
          if 'google-services' not in u:
              u = u.replace('id("org.jetbrains.kotlin.android")', 'id("com.google.gms.google-services") version "4.4.2" apply false\n    id("org.jetbrains.kotlin.android")', 1)
              open(r, 'w').write(u)
          print('patched')
          PYEOF

      - name: Make round app icon from app-logo.png
        run: |
          mkdir -p assets
          cp shafaz-logo.png assets/logo.png
          convert app-logo.png -trim +repage -resize 440x440 -background "#3D0519" -gravity center -extent 512x512 icon512.png
          convert icon512.png \( +clone -alpha extract -draw "fill black polygon 0,0 0,512 512,512 512,0" -fill white -draw "circle 256,256 256,0" \) -compose CopyOpacity -composite round512.png
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            convert round512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      - name: Build the APK
        run: |
          flutter pub get
          flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: shafaz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
